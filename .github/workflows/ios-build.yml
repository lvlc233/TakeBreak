name: iOS unsigned build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build iOS Simulator app and extensions
        working-directory: ios
        run: >
          xcodebuild
          -project TakeABreak.xcodeproj
          -scheme TakeABreak
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/TakeABreakDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Launch in iPhone Simulator and capture UI
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone") and d["state"] == "Shutdown"))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/TakeABreakDerivedData/Build/Products/Debug-iphonesimulator/TakeABreak.app"
          xcrun simctl launch "$DEVICE" com.takeabreak.app
          sleep 3
          mkdir -p "$RUNNER_TEMP/TakeABreakScreenshots"
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/TakeABreakScreenshots/home.png"
      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: iphone-simulator-home
          path: ${{ runner.temp }}/TakeABreakScreenshots/home.png
